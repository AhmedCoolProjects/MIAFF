reporting:
  tasks:
    - name: malware_binary
    - name: phishing_binary
    - name: malware_family
  effectiveness:
    rows:
      - group
    subrows:
      - run
    columns:
      - dataset
      - macro_f1
      - binary_f1
      - accuracy
      - balanced_accuracy
      - auroc
      - mcc

ablation:
  model:
    # - Metadata_MLP
    - CharCNN
  categories:
    only:
      - rdap
      - dns
      - tls
      - ip
      - cross
    drop:
      - rdap
      - dns
      - tls
      - ip
      - cross
    combine:
      - name: "rdap_dns"
        categories:
          - rdap
          - dns
  logging:
    wandb:
      project: "dom-2"
      group: "{model}_ablation"
      run_name: "{mode}_{combine_name}"
      tags:
        - metadata
        - ablation
  reporting:
    datasets:
      # - name: threatfox_malware_binary
      # - name: macformer_malware_binary
      # - name: duben_malware_binary
      # - name: dibhran_malware_binary
      # - name: threatfox_malware_family
      # - name: dibhran_malware_family
      - name: macformer_phishing_binary
      - name: duben_phishing_binary
      - name: dibhran_phishing_binary
    metrics:
      - macro_f1
    output:
      file: 09_output/05_Reporting/ablation_{combine_name}.csv
      columns:
        - all_categories
        - only_rdap
        - only_dns
        - only_tls
        - only_ip
        - only_cross
        - drop_rdap
        - drop_dns
        - drop_tls
        - drop_ip
        - drop_cross
        - delta_only_rdap_vs_all
        - delta_only_dns_vs_all
        - delta_only_tls_vs_all
        - delta_only_ip_vs_all
        - delta_only_cross_vs_all
        - delta_drop_rdap_vs_all
        - delta_drop_dns_vs_all
        - delta_drop_tls_vs_all
        - delta_drop_ip_vs_all
        - delta_drop_cross_vs_all
      rows:
        - dataset

interpretability:
  datasets:
    - name: threatfox_malware_binary
    - name: macformer_malware_binary
    - name: duben_malware_binary
    - name: dibhran_malware_binary
    - name: macformer_phishing_binary
    - name: duben_phishing_binary
    - name: dibhran_phishing_binary
    - name: threatfox_malware_family
    - name: dibhran_malware_family
  methods:
    - name: "SHAP"
      abbreviation: SHAP
    - name: "Integrated Gradients"
      abbreviation: IG
  examples_to_explain:
    binary: 3
    multi_class: 3
    criteria: "binary: pick 3 true positives, multi_class: pick 3 samples that are correctly classified"
  levels:
    modality:
      model:
        - CharCNN
      combination:
        - N_cat_N_ce
      description: "For each example give percentage of contribution of string vs. metadata."
    category:
      model:
        - Metadata_MLP
      description: "For each example give percentage of contribution of each category."
    feature:
      model:
        - Metadata_MLP
      top: 5
      description: "For each example give percentage of contribution of each feature of the top 5 most contributing features."
  contributions:
    - name: absolute
    - name: positive_only
    - name: signed
  output:
    file: 09_output/06_Interpreting/Interpretability/{contribution}/{method}_{dataset}.csv
    rows:
      - example
      - level
    columns:
      - value
      - contribution_percentage
      - contribution_score
      - contribution_rank











