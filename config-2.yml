combination_components:
  sampling_strategies:
    natural: {}
    class_balanced:
      replacement: true
      epoch_size: train_size
  fusion_methods:
    concat:
      head_hidden_dim: 128
      drop_prob: 0.2
    gated_residual:
      fusion_dim: 128
      head_hidden_dim: 128
      drop_prob: 0.2
  class_prior_corrections:
    none: {}
  loss_objectives:
    cross_entropy:
      label_smoothing: 0.0
    focal:
      gamma: 2.0
    class_weighted_cross_entropy:
      weighting: inverse_frequency
      normalize: mean_one
    logit_adjusted_cross_entropy:
      tau: 1.0

combinations:
  N_cat_N_ce:
    name: "N_cat_N_ce"
    sampling_strategy: natural
    fusion_method: concat
    class_prior_correction: none
    loss_objective: cross_entropy
  N_gatedres_N_ce:
    name: "N_gatedres_N_ce"
    sampling_strategy: natural
    fusion_method: gated_residual
    class_prior_correction: none
    loss_objective: cross_entropy
  N_cat_N_focal:
    name: "N_cat_N_focal"
    sampling_strategy: natural
    fusion_method: concat
    class_prior_correction: none
    loss_objective: focal
  N_cat_N_cwce:
    name: "N_cat_N_cwce"
    sampling_strategy: natural
    fusion_method: concat
    class_prior_correction: none
    loss_objective: class_weighted_cross_entropy
  N_cat_N_lace:
    name: "N_cat_N_lace"
    sampling_strategy: natural
    fusion_method: concat
    class_prior_correction: none
    loss_objective: logit_adjusted_cross_entropy


