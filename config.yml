scenarios:
  malware:
    task: binary_classification
    splits:
      train: train.csv
      dev: dev.csv
      test: test.csv
    columns:
      domain: input
      target: label
      ignore:
        - class
        - label_int
        - _error
        - _elapsed_s
    labels:
      negative: legit
      positive: malicious
    datasets:
      - name: threatfox_malware_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/ThreatFox/malware
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/malware.txt
      - name: macformer_malware_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/MACFormer/malware
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/malware.txt
      - name: duben_malware_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/DeepURLBench/malware
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/malware.txt
      - name: dibhran_malware_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/DataInBriefHranicky/malware
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/malware.txt
  phishing:
    task: binary_classification
    splits:
      train: train.csv
      dev: dev.csv
      test: test.csv
    columns:
      domain: input
      target: label
      ignore:
        - class
        - label_int
        - _error
        - _elapsed_s
    labels:
      negative: legit
      positive: malicious
    datasets:
      - name: macformer_phishing_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/MACFormer/phishing
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/phishing.txt
      - name: duben_phishing_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/DeepURLBench/phishing
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/phishing.txt
      - name: dibhran_phishing_binary
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/DataInBriefHranicky/phishing
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/phishing.txt
  malware_family:
    task: multi_class_classification
    splits:
      train: train.csv
      dev: dev.csv
      test: test.csv
    columns:
      domain: input
      target: class
      ignore:
        - label
        - label_int
        - _error
        - _elapsed_s
    datasets:
      - name: threatfox_malware_family
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/ThreatFox/malware_types
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/malware_family.txt
      - name: dibhran_malware_family
        path: ${LOCAL_PATH:-./data}/MIAF_DomainDetection_Infrastructure_Datasets/DataInBriefHranicky/malware_classes
        selected_infra_metadata: 09_output/01_metadata_selection/tasks/malware_family.txt


models:
  defaults:
    embedding_dim: 128
    drop_prob: 0.2

  Metadata_MLP:
    hidden_dim: 128
    out_dim: 64
    drop_prob: 0.2
    use_layernorm: true
    head_hidden_dim: 0

  CharCNN:
    num_filters: 100
    kernel_sizes: [3, 4, 5]

  CharLSTM:
    hidden_dim: 128
    n_layers: 2

  CharGRU:
    hidden_dim: 128
    n_layers: 2

  CharBiLSTM:
    hidden_dim: 128
    n_layers: 2

  CharBiGRU:
    hidden_dim: 128
    n_layers: 2

  CharCNNBiLSTM:
    hidden_dim: 128
    n_layers: 2
    num_filters: 100
    kernel_sizes: [3, 4, 5]

  DomURLsBERT:
    pretrained_path: amahdaouy/DomURLs_BERT
    drop_prob: 0.2

  CySecBERT:
    pretrained_path: markusbayer/CySecBERT

  SecBERT:
    pretrained_path: jackaduma/SecBERT

  SecureBERT:
    pretrained_path: ehsanaghaei/SecureBERT

  URLBERT:
    pretrained_path: models/urlbert_model

learning_mlp:
  model_names:
    - Metadata_MLP
  data:
    include_selected_metadata: true
    batch_size: 256
    num_workers: 4
  training:
    seed: 42
    epochs: 12
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    device: auto
  validation:
    monitor: macro_f1
    patience: 3
    min_delta: 0.0
  testing:
    checkpoint: best
    binary_metrics:
      - macro_f1
      - binary_f1
      - accuracy
      - balanced_accuracy
      - precision
      - recall
      - ap
      - auroc
      - mcc
      - tp
      - fp
      - tn
      - fn
    multi_class_metrics:
      - macro_f1
      - weighted_f1
      - accuracy
      - balanced_accuracy
      - macro_precision
      - macro_recall
      - ap
      - auroc
      - mcc
  output:
    directory: 09_output/04_Learning/{model}/{dataset}
  logging:
    model:
      - total_parameters
      - trainable_parameters
      - non_trainable_parameters
      - parameter_size_mb
      - parameters_by_module
    wandb:
      project: miaff
      group: "{model}"
      run_name: baseline
      tags:
        - "{scenario}"
        - "{dataset}"
        - metadata
    system_info:
      time: seconds
      memory: MiB
    system:
      - peak_memory_train
      - peak_memory_val
      - peak_memory_test
      - time_train
      - time_val
      - time_test

