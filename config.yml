reporting:
  effectiveness:
    tables:
      - title: "Malware_Binary"
        datasets:
          - name: threatfox_malware_binary
          - name: macformer_malware_binary
          - name: duben_malware_binary
          - name: dibhran_malware_binary
        metrics:
          - macro_f1
          - mcc
          - accuracy
        runs:
          - name: baseline
            run_name: baseline
          - name: MIAFF_base
            run_name: N_cat_N_ce
          - name: MIAFF_best_macro_f1
            rule: "best run with best macro_f1 of that model in that dataset, will be used for all metrics for this MIAFF_best_macro_f1 run"
        models:
          nn:
            - name: CharCNN
            - name: CharLSTM
            - name: CharGRU
            - name: CharBiLSTM
            - name: CharBiGRU
            - name: CharCNNBiLSTM
          plm:
            - name: SecureBERT
            - name: CySecBERT
            - name: SecBERT
            - name: DomURLsBERT
        rows: model
        columns:
          - dataset
          - macro_f1_baseline
          - macro_f1_MIAFF_base
          - macro_f1_MIAFF_best_macro_f1
          - mcc_baseline
          - mcc_MIAFF_base
          - mcc_MIAFF_best_macro_f1
          - accuracy_baseline
          - accuracy_MIAFF_base
          - accuracy_MIAFF_best_macro_f1
          - MIAFF_best_macro_f1_run_name
      - title: "Phishing_Binary"
        datasets:
          - name: macformer_phishing_binary
          - name: duben_phishing_binary
