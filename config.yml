    output:
      file: 09_output/05_Reporting/effectiveness_{table.title}.csv
      latex_table: 09_output/05_Reporting/table_effectiveness_{table.title}.tex
      latex_table_details:
        digits_after_decimal: 3
        bold_indicates_better: true
        bold_values: "baseline vs MIAFF_base, baseline vs MIAFF_best_macro_f1"
        star_indicator_method: false
        star_values: "per dataset, best plm model + best nn model"
        bold_red_indicates_better: true
        bold_red_values: "MIAFF_base vs MIAFF_best_macro_f1, if same keep only bold, if better make it bold red"
      



